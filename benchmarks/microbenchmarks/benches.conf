# Microbenchmark registry, used by run.sh. One benchmark per line:
#
#   name     unique name for identification
#   wasm     guest module in build/
#   param    parameter for bench_setup (input size, N, ...)
#   iters    parameter for bench_run, should ideally be number of iters, best pick it so a sample takes >= 10 ms
#   warmup   untimed bench_run calls per process
#   samples  timed bench_run calls per process
#   expect   known checksum, - to use the one from the first run
#
# The same guest can appear several times with different params.
#
# name       wasm             param   iters  warmup  samples  expect
fib          fibonacci.wasm   20      200    2       10       -
bub          bubblesort.wasm  200     100    2       10       -
bubfull      bubblesort.wasm  16000   1      1       1        -
qsort        quicksort.wasm   16000   100    2       10       -
